# fly.toml app configuration file generated for halloween2026-board on 2026-10-31T23:02:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'halloween2026-board'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  ALLOWED_ORIGINS = 'https://nerd-omang.github.io'
  BOARD_SIZE = '20'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = '30s'
    timeout = '3s'
    grace_period = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
